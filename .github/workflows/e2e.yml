# .github/workflows/e2e.yml
name: E2E

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1' # weekly, Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3001
      MONGODB_URI: mongodb://localhost:27017/taskverse_e2e
      JWT_SECRET: e2e-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: e2e-refresh-secret-at-least-32-characters-long
      ALLOWED_ORIGINS: http://localhost:5173
      METRICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/types --workspace=packages/scheduler --workspace=apps/api
      - run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          node apps/api/dist/server.js > api.log 2>&1 &
          npx wait-on --timeout 60000 http://localhost:3001/health/ready
      - name: Run E2E tests
        run: npx playwright test --project=chromium
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
          retention-days: 14
