# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/types --workspace=packages/utils --workspace=packages/scheduler
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build --workspace=apps/api --workspace=apps/web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  scheduler:
    name: Scheduler unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test --workspace=packages/scheduler

  api:
    name: API integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/types --workspace=packages/scheduler
      - name: Test with coverage
        run: npm run test:coverage --workspace=apps/api
        env:
          NODE_ENV: test
          JWT_SECRET: ci-access-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      - uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          retention-days: 14

  benchmarks:
    name: Research harness smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/scheduler
      - run: npm run bench:policies --workspace=research -- --sizes=50 --workers=1 --horizons=240 --seeds=1,2
      - run: npm run bench:forecast --workspace=research -- --history=30 --backlog=20 --runs=20 --trials=500
      - run: npm run bench:scaling --workspace=research -- --sizes=100,1000 --repeats=2
