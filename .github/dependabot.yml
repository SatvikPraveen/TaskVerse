# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      typescript-eslint:
        patterns: ['@typescript-eslint/*', 'eslint*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-tooling:
        dependency-type: development
    # Major upgrades are done deliberately as separate migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    # Major upgrades are done deliberately as separate migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    # Major upgrades are done deliberately as separate migrations.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
